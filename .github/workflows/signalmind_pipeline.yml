name: SignalMind Cloud Pipeline

on:
  schedule:
    - cron: "30 13 * * 1-5"  # US Market Open: Summer / EDT (9:30 AM NY = 13:30 UTC)
    - cron: "30 14 * * 1-5"  # US Market Open: Winter / EST (9:30 AM NY = 14:30 UTC)
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to analyze'
        required: true
        default: 'US'
        type: choice
        options:
          - US

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  us_analysis:
    name: US Market Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEYS }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MARKET_TARGET: "US"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Update Prices First
        run: python src/price_updater.py
      - name: Run US Analysis
        run: python src/main.py
      - name: Track Portfolio
        run: python src/trade_tracker.py
