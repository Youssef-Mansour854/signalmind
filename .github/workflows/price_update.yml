name: SignalMind Intraday Price Updater & Trade Tracker

on:
  schedule:
    - cron: "30 16 * * 1-5"  # US Market Mid-Day: Summer / EDT (12:30 PM NY = 16:30 UTC)
    - cron: "30 17 * * 1-5"  # US Market Mid-Day: Winter / EST (12:30 PM NY = 17:30 UTC)
    - cron: "15 20 * * 1-5"  # US Market Close: Summer / EDT (4:15 PM NY = 20:15 UTC)
    - cron: "15 21 * * 1-5"  # US Market Close: Winter / EST (4:15 PM NY = 21:15 UTC)
  workflow_dispatch:

concurrency:
  group: price-update-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_prices:
    name: Update Intraday Prices & Track Portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEYS }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      MARKET_TARGET: "US"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Price Updater (DAY_TRADE Focus)
        run: python src/price_updater.py
      - name: Run Trade Tracker
        run: python src/trade_tracker.py
      - name: Run Portfolio Brief
        run: python src/bot_notifier.py
