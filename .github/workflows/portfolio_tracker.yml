name: SignalMind Portfolio Trade Tracker (Instant TP/SL Monitor)

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"  # Every 30 minutes during US Market Trading Hours (Summer/Winter EDT/EST)
  workflow_dispatch:

concurrency:
  group: portfolio-tracker-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track_portfolio:
    name: Monitor Active Portfolio Trades & Instant Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      MARKET_TARGET: "US"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Active Portfolio Trade Tracker
        run: python src/trade_tracker.py
